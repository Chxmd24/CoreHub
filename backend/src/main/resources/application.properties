# CoreHub Application Configuration
spring.application.name=CoreHub

# Server Port (Railway dynamic PORT binding with fallback to SERVER_PORT or 8080)
server.port=${PORT:${SERVER_PORT:8080}}

# Disable session persistence for stateless REST API
server.servlet.session.persistent=false

# ==========================================
# MySQL Database Configuration
# ==========================================
# Supports full JDBC URL (SPRING_DATASOURCE_URL), Railway MySQL variables (MYSQLHOST, MYSQLPORT, etc.),
# or individual DB_* properties, falling back to local development defaults.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://${DB_HOST:${MYSQLHOST:localhost}}:${DB_PORT:${MYSQLPORT:3306}}/${DB_NAME:${MYSQLDATABASE:corehub_db}}?createDatabaseIfNotExist=true&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=${DB_USE_SSL:false}}
spring.datasource.username=${DB_USERNAME:${MYSQLUSER:root}}
spring.datasource.password=${DB_PASSWORD:${MYSQLPASSWORD:}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# JPA / Hibernate Configuration
# ==========================================
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${FORMAT_SQL:false}
spring.jpa.open-in-view=false

# ==========================================
# JWT Security Configuration
# ==========================================
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# ==========================================
# CORS Security Configuration
# ==========================================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://127.0.0.1:3000}

# ==========================================
# Reservation Expiration Configuration
# ==========================================
app.reservation.expiry-hours=${RESERVATION_EXPIRY_HOURS:24}
app.reservation.expiry-check-interval-ms=${RESERVATION_EXPIRY_CHECK_INTERVAL_MS:60000}
