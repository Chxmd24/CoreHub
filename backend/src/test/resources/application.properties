# ==========================================
# Test Application Properties
# ==========================================
spring.application.name=CoreHub-Test
server.servlet.session.persistent=false

# Database Configuration for Tests
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:corehub_db}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration for Tests
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Test-only JWT Signing Key (Used strictly for automated test suites - decodes to 32 bytes)
app.jwt.secret=Q29yZUh1YlRlc3RTZWNyZXRLZXkzMkJ5dGVzTG9uZyE=
app.jwt.expiration-ms=3600000
